<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<title>WasThat A layer 1-background</title>
<defs>
<linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#6AD6FF"/><stop offset="1" stop-color="#2E6CF6"/>
</linearGradient>
<linearGradient id="a-bg-user" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
  <stop offset="0" stop-color="#6AD6FF"/><stop offset="1" stop-color="#2E6CF6"/>
</linearGradient>
<radialGradient id="a-glow" cx="0.3" cy="0.12" r="0.75">
  <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<linearGradient id="a-card" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9F0FB"/>
</linearGradient>
<linearGradient id="a-app" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#8FDCFF"/><stop offset="1" stop-color="#4C8DF8"/>
</linearGradient>
<linearGradient id="a-badge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FF7A66"/><stop offset="1" stop-color="#F0323C"/>
</linearGradient>
<filter id="a-sh" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/></filter>
<filter id="a-qsh" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#8A0E16" flood-opacity="0.18"/></filter>
</defs>
<rect x="0" y="0" width="1024" height="1024" fill="url(#a-bg)"/><rect x="0" y="0" width="1024" height="1024" fill="url(#a-glow)"/>
</svg>
